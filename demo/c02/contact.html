<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>お問い合わせ｜デモ工務店</title><link rel="stylesheet" href="../demo.css"></head><body><div class="demo">これはササリーチの動作テスト用の<b>架空の会社</b>です。入力した内容はどこにも送られません。</div><header><b>デモ工務店</b><nav><a href="./">トップ</a><a href="contact.html">お問い合わせ</a></nav></header><main><h1>お問い合わせフォーム</h1>
<form action="thanks.html" method="get">
<label>会社名・団体名</label><input type="text" name="kaisha">
<label>お名前<span class="req">必須</span></label><div class="row"><input type="text" name="sei" placeholder="姓" required><input type="text" name="mei" placeholder="名" required></div>
<label>フリガナ<span class="req">必須</span></label><div class="row"><input type="text" name="sei_kana" placeholder="セイ" required><input type="text" name="mei_kana" placeholder="メイ" required></div>
<label>メールアドレス<span class="req">必須</span></label><input type="email" name="mail" required>
<label>電話番号<span class="req">必須</span></label><input type="tel" name="tel" required>
<label>郵便番号</label><input type="text" name="zip" placeholder="1234567（ハイフンなし）">
<label>ご住所</label><input type="text" name="addr">
<label>お問い合わせの種類<span class="req">必須</span></label><select name="kind" required><option value="">選択してください</option><option>新築のご相談</option><option>リフォームのご相談</option><option>その他</option></select>
<label>お問い合わせ内容<span class="req">必須</span></label><textarea name="body" required></textarea>
<label><input type="checkbox" name="agree" required> 個人情報の取り扱いに同意する<span class="req">必須</span></label>
<button type="submit">送信</button></form></main><footer>© デモ工務店（架空）</footer></body></html>
